<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "Le Petit Bistrot",
  "image": "https://picsum.photos/seed/petit-bistrot/800/400",
  "servesCuisine": "French, Mediterranean, Contemporary",
  "priceRange": "$$$",
  "address": "42 Rue de Rivoli, Paris 75001, France",
  "telephone": "+33 1 42 96 12 34",
  "url": "https://example.org/le-petit-bistrot"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Restaurant",
    titleProp: "name",
    icon: "🍽️",
    accent: "#dc2626",
    fields: [
      { prop: "name",          label: "Name",       type: "text" },
      { prop: "image",         label: "Photo",      type: "image" },
      { prop: "servesCuisine", label: "Cuisine",    type: "text" },
      { prop: "priceRange",    label: "Price",      type: "text" },
      { prop: "address",       label: "Address",    type: "text" },
      { prop: "telephone",     label: "Telephone",  type: "tel" },
      { prop: "url",           label: "Website",    type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
