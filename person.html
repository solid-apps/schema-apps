<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Person — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Ada Lovelace",
  "image": "https://picsum.photos/seed/ada-portrait/600/400",
  "jobTitle": "Mathematician",
  "email": "ada@example.org",
  "telephone": "+44 20 7946 0958",
  "url": "https://example.org/ada",
  "description": "Pioneer of computing; wrote the first algorithm intended for a machine."
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Person",
    titleProp: "name",
    icon: "👤",
    accent: "#2d6cdf",
    fields: [
      { prop: "name",        label: "Name",      type: "text" },
      { prop: "image",       label: "Photo",     type: "image" },
      { prop: "jobTitle",    label: "Job title", type: "text" },
      { prop: "email",       label: "Email",     type: "email" },
      { prop: "telephone",   label: "Telephone", type: "tel" },
      { prop: "url",         label: "Website",   type: "url" },
      { prop: "description", label: "About",     type: "textarea" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
