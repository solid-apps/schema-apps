<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hostel — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Hostel",
  "name": "Mosaic House",
  "image": "https://picsum.photos/seed/mosaic-house/600/400",
  "description": "Prague's design-conscious hostel, housed in a converted Art Deco warehouse steps from the Vltava embankment in New Town. Dorm beds come with privacy curtains, individual reading lights and USB chargers; private en-suite rooms rival boutique hotels at a fraction of the price. The ground-floor café serves specialty coffee from local roasters Doubleshot, and the basement bar hosts nightly trivia, live acoustic sets and impromptu pub crawls. Green-certified with solar panels, rainwater recycling and a zero-waste kitchen — proof that budget travel and sustainability can coexist beautifully.",
  "address": "Odborů 4, 120 00 Prague 2 - Nové Město, Czech Republic",
  "telephone": "+420 221 491 580",
  "priceRange": "€",
  "checkinTime": "15:00",
  "checkoutTime": "10:00",
  "url": "https://example.org/mosaic-house"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Hostel",
    titleProp: "name",
    icon: "🛌",
    accent: "#6366f1",
    fields: [
      { prop: "name",        label: "Name",          type: "text" },
      { prop: "image",       label: "Image",         type: "image" },
      { prop: "description", label: "Description",   type: "textarea" },
      { prop: "address",     label: "Address",       type: "text" },
      { prop: "telephone",   label: "Phone",         type: "text" },
      { prop: "priceRange",  label: "Price Range",   type: "text" },
      { prop: "checkinTime", label: "Check-in",      type: "text" },
      { prop: "checkoutTime",label: "Check-out",     type: "text" },
      { prop: "url",         label: "Website",       type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
