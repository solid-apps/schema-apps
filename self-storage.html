<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SelfStorage — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "SelfStorage",
  "name": "BoxPoint Self Storage — Prague West",
  "image": "https://picsum.photos/seed/boxpoint-self-storage-prague-west/800/450",
  "description": "Climate-controlled self-storage by the Rozvadovská spojka: units from locker-size to forty cubic metres, 24/7 chip access, CCTV and per-unit alarms. Month-to-month contracts with online move-in, free van loan for new customers, and a receiving service that signs for deliveries straight into your unit.",
  "address": "Obchodní 110, 251 01 Čestlice",
  "telephone": "+420 323 605 400",
  "openingHours": "Access 24/7; office Mo-Sa 09:00-18:00",
  "priceRange": "From 690 CZK/month",
  "url": "https://example.org/boxpoint-self-storage-prague-west"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "SelfStorage",
    titleProp: "name",
    icon: "🗄️",
    accent: "#64748b",
    fields: [
      { prop: "name", label: "Name", type: "text" },
      { prop: "image", label: "Photo", type: "image" },
      { prop: "description", label: "About", type: "textarea" },
      { prop: "address", label: "Address", type: "text" },
      { prop: "telephone", label: "Phone", type: "tel" },
      { prop: "openingHours", label: "Open", type: "text" },
      { prop: "priceRange", label: "Price", type: "text" },
      { prop: "url", label: "Website", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
