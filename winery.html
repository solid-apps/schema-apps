<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Winery — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Winery",
  "name": "Sonberk Winery",
  "image": "https://picsum.photos/seed/sonberk-winery/600/400",
  "description": "An award-winning South Moravian winery perched on the limestone slopes above the Nové Mlýny reservoirs. Specialises in crisp white wines — Pálava, Riesling and Sauvignon — grown in the region's sun-drenched loess terroir. The modern tasting room opens onto terraced vines with views stretching to the Pálava hills, a UNESCO biosphere reserve.",
  "address": "Sonberk 503, 691 65 Popice, Czech Republic",
  "telephone": "+420 519 515 022",
  "openingHours": "Apr-Oct We-Su 10:00-18:00, Nov-Mar by appointment",
  "priceRange": "150–600 CZK (tasting)",
  "url": "https://example.org/sonberk"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Winery",
    titleProp: "name",
    icon: "🍇",
    accent: "#7e22ce",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
