<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SocialEvent — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "SocialEvent",
  "name": "Summer Rooftop Mixer",
  "image": "https://picsum.photos/seed/rooftop-party/600/400",
  "description": "An evening networking social on a rooftop terrace with craft cocktails, live jazz and panoramic city views. Meet fellow creatives, founders and technologists in a relaxed open-air setting. Dress code: smart casual.",
  "startDate": "2026-08-08T18:00:00+02:00",
  "endDate": "2026-08-08T23:00:00+02:00",
  "location": "Skyline Terrace, Prague",
  "organizer": "Prague Creatives Network",
  "url": "https://example.org/rooftop-mixer"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "SocialEvent",
    titleProp: "name",
    icon: "🥂",
    accent: "#fb923c",
    fields: [
      { prop: "name",        label: "Event name",  type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "startDate",   label: "Start date",  type: "text" },
      { prop: "endDate",     label: "End date",    type: "text" },
      { prop: "location",    label: "Location",    type: "text" },
      { prop: "organizer",   label: "Organizer",   type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
