<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f5f5f7;
    --surface: #fff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --border: rgba(0,0,0,.06);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.07);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
    --radius: 14px;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero header ── */
  .hero {
    text-align: center;
    padding: 4rem 1.5rem 2.5rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .hero-label {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: .8rem;
  }
  .hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -.04em;
    margin: 0 0 .5rem;
    line-height: 1.05;
  }
  .hero p {
    font-size: 1.05rem;
    color: var(--text-2);
    line-height: 1.55;
    margin: 0;
  }

  /* ── Grid ── */
  .grid-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1rem;
  }

  /* ── Card ── */
  .card {
    display: flex;
    align-items: flex-start;
    gap: .85rem;
    padding: 1.1rem 1.2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform .22s cubic-bezier(.22,1,.36,1),
                box-shadow .22s cubic-bezier(.22,1,.36,1),
                border-color .18s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: color-mix(in oklab, var(--card-accent, #6366f1) 40%, transparent);
  }

  /* Icon circle */
  .card-icon {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    background: color-mix(in oklab, var(--card-accent, #6366f1) 10%, transparent);
    color: var(--card-accent, #6366f1);
  }

  /* Text */
  .card-body { min-width: 0; flex: 1; }
  .card-name {
    font-size: .92rem;
    font-weight: 700;
    letter-spacing: -.01em;
    margin: 0 0 .15rem;
    color: var(--text);
  }
  .card-tag {
    font-size: .78rem;
    color: var(--text-3);
    line-height: 1.4;
    margin: 0;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: .8rem;
    color: var(--text-3);
  }
  .footer a {
    color: var(--text-2);
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { text-decoration: underline; }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #6e6e73;
      --border: rgba(255,255,255,.07);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
      --shadow-md: 0 4px 16px rgba(0,0,0,.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.45);
    }
  }

  /* ── Mobile ── */
  @media (max-width: 560px) {
    .hero { padding: 2.5rem 1.2rem 1.8rem; }
    .hero h1 { font-size: 2rem; }
    .hero p { font-size: .92rem; }
    .grid-wrap { padding: 0 1rem 2rem; }
    .grid { grid-template-columns: 1fr; gap: .75rem; }
  }
</style>
</head>
