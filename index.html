<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>schema-apps — schema.org rendered views</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f5f5f7;
    --surface: #fff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --border: rgba(0,0,0,.06);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.07);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
    --radius: 14px;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero header ── */
  .hero {
    text-align: center;
    padding: 4rem 1.5rem 2.5rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .hero-label {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: .8rem;
  }
  .hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -.04em;
    margin: 0 0 .5rem;
    line-height: 1.05;
  }
  .hero p {
    font-size: 1.05rem;
    color: var(--text-2);
    line-height: 1.55;
    margin: 0;
  }

  /* ── Grid ── */
  .grid-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
  }

  /* ── Card ── */
  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform .22s cubic-bezier(.22,1,.36,1),
                box-shadow .22s cubic-bezier(.22,1,.36,1),
                border-color .18s ease;
    cursor: pointer;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: color-mix(in oklab, var(--card-accent, #6366f1) 40%, transparent);
  }

  /* ── Live preview iframe container ── */
  .preview-wrap {
    position: relative;
    width: 100%;
    /* 4:3 aspect ratio container */
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--bg);
    pointer-events: none;
  }
  .preview-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    /* Scale 2.5x so content fills the container with detail */
    width: 250%;
    height: 250%;
    border: none;
    transform: scale(0.4);
    transform-origin: top left;
    pointer-events: none;
  }

  /* ── Card label (bottom) ── */
  .card-label {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .8rem 1rem;
    border-top: 1px solid var(--border);
  }
  .card-icon {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    background: color-mix(in oklab, var(--card-accent, #6366f1) 10%, transparent);
  }
  .card-name {
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text);
  }
  .card-tag {
    font-size: .7rem;
    color: var(--text-3);
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: .8rem;
    color: var(--text-3);
  }
  .footer a {
    color: var(--text-2);
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { text-decoration: underline; }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #6e6e73;
      --border: rgba(255,255,255,.07);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
      --shadow-md: 0 4px 16px rgba(0,0,0,.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.45);
    }
    .preview-wrap {
      background: #0d0d0f;
    }
  }

  /* ── Mobile ── */
  @media (max-width: 560px) {
    .hero { padding: 2.5rem 1.2rem 1.8rem; }
    .hero h1 { font-size: 2rem; }
    .hero p { font-size: .92rem; }
    .grid-wrap { padding: 0 1rem 2rem; }
    .grid { grid-template-columns: 1fr; gap: .75rem; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-label">Open Source</div>
  <h1>schema-apps</h1>
  <p>Beautiful rendered views for schema.org types. Each app is a single HTML file powered by a JSON-LD data island.</p>
</header>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<footer class="footer">
  <a href="https://github.com/solid-apps/schema-apps">github.com/solid-apps/schema-apps</a> · built with ❤️ by <a href="https://github.com/melvincarvalho">Melvin</a> &amp; Charlie
</footer>

<script>
const APPS = [
  { file: "person.html",        name: "Person",        icon: "\u{1F464}", accent: "#2d6cdf", tag: "Profile" },
  { file: "organization.html",  name: "Organization",  icon: "\u{1F3E2}", accent: "#0e7490", tag: "Company" },
  { file: "event.html",         name: "Event",         icon: "\u{1F4C5}", accent: "#7c3aed", tag: "Event poster" },
  { file: "recipe.html",        name: "Recipe",        icon: "\u{1F373}", accent: "#e8612c", tag: "Recipe card" },
  { file: "movie.html",         name: "Movie",         icon: "\u{1F3AC}", accent: "#f59e0b", tag: "Cinematic" },
  { file: "music-album.html",   name: "MusicAlbum",    icon: "\u{1F4BF}", accent: "#10b981", tag: "Album" },
  { file: "review.html",        name: "Review",        icon: "\u2B50",    accent: "#d97706", tag: "Review" },
  { file: "course.html",        name: "Course",        icon: "\u{1F393}", accent: "#0284c7", tag: "Course" },
  { file: "book.html",          name: "Book",          icon: "\u{1F4DA}", accent: "#9333ea", tag: "Book jacket" },
  { file: "product.html",       name: "Product",       icon: "\u{1F392}", accent: "#b45309", tag: "Product page" },
  { file: "restaurant.html",    name: "Restaurant",    icon: "\u{1F37D}\uFE0F", accent: "#dc2626", tag: "Restaurant" },
  { file: "article.html",       name: "Article",       icon: "\u{1F4F0}", accent: "#475569", tag: "Article" },
  { file: "job-posting.html",   name: "JobPosting",    icon: "\u{1F4BC}", accent: "#6d28d9", tag: "Job" },
];

const grid = document.getElementById("grid");
for (const app of APPS) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "./" + app.file;
  a.style.setProperty("--card-accent", app.accent);

  // Live iframe preview
  const preview = document.createElement("div");
  preview.className = "preview-wrap";
  const iframe = document.createElement("iframe");
  iframe.src = "./" + app.file;
  iframe.loading = "lazy";
  iframe.setAttribute("sandbox", "allow-same-origin");
  iframe.setAttribute("tabindex", "-1");
  iframe.setAttribute("aria-hidden", "true");
  preview.appendChild(iframe);
  a.appendChild(preview);

  // Label
  const label = document.createElement("div");
  label.className = "card-label";
  label.innerHTML =
    '<div class="card-icon">' + app.icon + '</div>' +
    '<div>' +
      '<div class="card-name">' + app.name + '</div>' +
      '<div class="card-tag">' + app.tag + '</div>' +
    '</div>';
  a.appendChild(label);

  grid.appendChild(a);
}
</script>
</body>
</html>
