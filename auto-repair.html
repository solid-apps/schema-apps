<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoRepair — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "AutoRepair",
  "name": "Garage Hrádek",
  "image": "https://picsum.photos/seed/hradek-garage/600/400",
  "description": "A family-run garage in Vysočany that has been fixing cars since 1989. Specialises in Škoda, VW Group and common Asian imports — everything from timing belts and clutch replacements to air-conditioning recharges. Honest diagnostics: they show you the worn part before quoting. No appointment needed for oil changes and tyre swaps; larger jobs booked within 48 hours.",
  "address": "Kolbenova 33, 190 00 Prague 9, Czech Republic",
  "telephone": "+420 281 920 445",
  "openingHours": "Mo-Fr 07:30-17:30, Sa 08:00-12:00",
  "priceRange": "500–25 000 CZK",
  "url": "https://example.org/garage-hradek"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "AutoRepair",
    titleProp: "name",
    icon: "🔧",
    accent: "#57534e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
