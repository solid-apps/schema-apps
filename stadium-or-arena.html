<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StadiumOrArena — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "StadiumOrArena",
  "name": "O2 Arena Prague",
  "image": "https://picsum.photos/seed/o2-arena/600/400",
  "description": "Prague's premier multi-purpose arena, seating up to 18 000 for concerts and 17 000 for hockey. Hosts IIHF ice-hockey championships, ATP tennis finals, world touring musicians and major e-sports events. A retractable roof and state-of-the-art acoustics make it the go-to venue for mega-events in Central Europe.",
  "address": "Ocelářská 460/2, 190 00 Prague 9, Czech Republic",
  "openingHours": "Box office Mo-Fr 10:00-18:00, event days 10:00–event end",
  "url": "https://example.org/o2-arena"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "StadiumOrArena",
    titleProp: "name",
    icon: "🏟️",
    accent: "#16a34a",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
