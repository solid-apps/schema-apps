<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TelevisionChannel — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "TelevisionChannel",
  "name": "ČT24 — Czech Television News Channel",
  "image": "https://picsum.photos/seed/ct24-channel/800/450",
  "description": "The 24-hour news channel of Czech Television, broadcasting continuous news, parliamentary coverage and live events since 2005. ČT24 runs flagship evening analysis programmes, regional newsrooms in Brno and Ostrava, and simultaneous streaming with subtitles. As a public-service channel it is funded by licence fees and bound by balance requirements monitored by the broadcasting council.",
  "broadcastChannelId": "ČT24",
  "providesBroadcastService": "Česká televize 24h news service",
  "inLanguage": "cs",
  "url": "https://example.org/ct24"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "TelevisionChannel",
    titleProp: "name",
    icon: "📺",
    accent: "#6d28d9",
    fields: [
      { prop: "name", label: "Channel", type: "text" },
      { prop: "image", label: "Ident", type: "image" },
      { prop: "description", label: "About", type: "textarea" },
      { prop: "broadcastChannelId", label: "Channel ID", type: "text" },
      { prop: "providesBroadcastService", label: "Service", type: "text" },
      { prop: "inLanguage", label: "Language", type: "text" },
      { prop: "url", label: "Watch", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
