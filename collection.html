<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Collection — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Collection",
  "name": "The Sudek Archive — Negatives Collection",
  "image": "https://picsum.photos/seed/sudek-negatives/800/450",
  "description": "The collection of 21,000 original negatives from Josef Sudek's studio, held by the Institute of Art History and digitised between 2013 and 2021. The collection spans the panoramic Prague cycles, the window still-lifes from the Újezd studio, and commercial commissions that funded the poetry. Each negative carries conservation notes and links to known prints in public collections.",
  "author": "Josef Sudek (creator); ÚDU AV ČR (custodian)",
  "dateCreated": "1920-1976",
  "url": "https://example.org/sudek-archive"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Collection",
    titleProp: "name",
    icon: "🗃️",
    accent: "#0d9488",
    fields: [
      { prop: "name", label: "Collection", type: "text" },
      { prop: "image", label: "Sample", type: "image" },
      { prop: "description", label: "About", type: "textarea" },
      { prop: "author", label: "Creator", type: "text" },
      { prop: "dateCreated", label: "Period", type: "text" },
      { prop: "url", label: "Browse", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
