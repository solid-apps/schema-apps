<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Invoice",
  "name": "Invoice #2026-06-0147",
  "image": "https://picsum.photos/seed/invoice-paper/600/400",
  "description": "Monthly accounting services invoice from Novák & Partners s.r.o. for bookkeeping, payroll processing and tax compliance advisory for June 2026. Covers twelve employees and one subsidiary. Due net thirty days from issue date. Bank transfer to ČSOB account 221998776/0300, variable symbol 2026060147.",
  "totalPaymentDue": "18 500 CZK",
  "paymentDueDate": "2026-07-10",
  "paymentStatus": "https://schema.org/PaymentDue",
  "provider": "Novák & Partners s.r.o., Prague",
  "customer": "Světlotech a.s., Brno"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Invoice",
    titleProp: "name",
    icon: "🧾",
    accent: "#52525b",
    fields: [
      { prop: "name",            label: "Invoice #",       type: "text" },
      { prop: "image",           label: "Image",           type: "image" },
      { prop: "description",     label: "Description",     type: "textarea" },
      { prop: "totalPaymentDue", label: "Amount Due",      type: "text" },
      { prop: "paymentDueDate",  label: "Due Date",        type: "text" },
      { prop: "paymentStatus",   label: "Status",          type: "text" },
      { prop: "provider",        label: "Provider",        type: "text" },
      { prop: "customer",        label: "Customer",        type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
