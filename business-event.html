<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BusinessEvent — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "BusinessEvent",
  "name": "Decentralized Web Summit 2026",
  "image": "https://picsum.photos/seed/biz-conf/600/400",
  "description": "A two-day tech conference bringing together developers, entrepreneurs and researchers building the decentralized web. Keynotes, workshops and networking sessions on Solid, identity, data sovereignty and interoperability.",
  "startDate": "2026-09-20T09:00:00+02:00",
  "endDate": "2026-09-21T18:00:00+02:00",
  "location": "Berlin, Germany",
  "organizer": "Decentralized Web Foundation",
  "url": "https://example.org/dweb-summit"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "BusinessEvent",
    titleProp: "name",
    icon: "💼",
    accent: "#52525b",
    fields: [
      { prop: "name",        label: "Event name",  type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "startDate",   label: "Start date",  type: "text" },
      { prop: "endDate",     label: "End date",    type: "text" },
      { prop: "location",    label: "Location",    type: "text" },
      { prop: "organizer",   label: "Organizer",   type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
