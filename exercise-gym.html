<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ExerciseGym — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "ExerciseGym",
  "name": "CrossBox Karlín",
  "image": "https://picsum.photos/seed/crossbox-karlin/600/400",
  "description": "A warehouse-style functional-fitness gym in a converted Karlín factory building. Olympic lifting platforms, pull-up rigs, rowing machines and a tyre-flip alley — no treadmills, no mirrors. Group WODs run every hour from 06:00; personal coaching and mobility sessions available by appointment. First class is free. Community BBQ on the loading dock every last Friday of the month.",
  "address": "Sokolovská 93, 186 00 Prague 8, Czech Republic",
  "telephone": "+420 776 332 210",
  "openingHours": "Mo-Fr 06:00-21:00, Sa 08:00-16:00, Su 09:00-13:00",
  "priceRange": "1 200–3 000 CZK/month",
  "url": "https://example.org/crossbox-karlin"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "ExerciseGym",
    titleProp: "name",
    icon: "🏋️",
    accent: "#dc2626",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
