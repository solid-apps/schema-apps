<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Country — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Country",
  "name": "Czech Republic (Česká republika)",
  "image": "https://picsum.photos/seed/country-czech-republic/600/400",
  "description": "The Czech Republic is a landlocked country in Central Europe bordered by Germany to the west, Poland to the north-east, Slovakia to the east and Austria to the south. With a population of approximately 10.8 million and an area of 78,871 km², it comprises the historic lands of Bohemia, Moravia and Czech Silesia. The capital and largest city is Prague (Praha), home to 1.3 million people and one of the best-preserved medieval city centres in Europe — a UNESCO World Heritage Site. The country has a rich cultural heritage spanning the Gothic, Renaissance, Baroque, Art Nouveau and Cubist architectural styles, and is the birthplace of composers Dvořák and Smetana, writers Kafka and Čapek, and the Pilsner lager beer style invented in Plzeň in 1842. A parliamentary republic and member of the EU, NATO and the OECD, the Czech Republic has a high-income advanced economy driven by automotive manufacturing (Škoda Auto), engineering, IT services and tourism. The official language is Czech, a West Slavic language.",
  "address": "Central Europe — capital: Prague (Praha), population: ~10.8 million",
  "url": "https://www.cz.cz/en"
}
</script>
<main id="app"></main>
<script>
  window.APP = {
    type: "Country",
    titleProp: "name",
    icon: "🌐",
    accent: "#1e40af",
    fields: [
      { prop: "name",        label: "Country",     type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "address",     label: "Location",    type: "text" },
      { prop: "url",         label: "Info",        type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
