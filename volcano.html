<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Volcano — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Volcano",
  "name": "Mount Vesuvius",
  "image": "https://picsum.photos/seed/vesuvius/600/400",
  "description": "One of the world's most dangerous active volcanoes, infamous for the AD 79 eruption that buried Pompeii and Herculaneum. Its distinctive somma caldera profile looms over the Bay of Naples. A network of seismic sensors monitors it around the clock; the last major eruption was in 1944. Visitors can hike to the crater rim for sulphurous fumaroles and sweeping views of Campania.",
  "address": "Parco Nazionale del Vesuvio, 80044 Ottaviano NA, Italy",
  "url": "https://example.org/vesuvius"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Volcano",
    titleProp: "name",
    icon: "🌋",
    accent: "#dc2626",
    fields: [
      { prop: "name",        label: "Name",        type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "address",     label: "Address",     type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
