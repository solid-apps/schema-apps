<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Electrician — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Electrician",
  "name": "Elektro Novák — Licensed Electricians, Prague",
  "image": "https://picsum.photos/seed/elektro-nov-k-licensed-electricians-/800/450",
  "description": "A two-generation family electrical firm handling everything from flickering socket callouts to full rewiring of pre-war apartments. Licensed for revisions (revize) and EV charger installation, with transparent hourly rates published online. Emergency callouts answered within two hours across Prague; smaller jobs quoted from photos over WhatsApp.",
  "address": "Bělehradská 92, 120 00 Praha 2",
  "telephone": "+420 602 334 455",
  "openingHours": "Mo-Fr 07:00-17:00; emergencies 24/7",
  "priceRange": "500-900 CZK/h",
  "url": "https://example.org/elektro-nov-k-licensed-electricians-"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Electrician",
    titleProp: "name",
    icon: "⚡",
    accent: "#eab308",
    fields: [
      { prop: "name", label: "Name", type: "text" },
      { prop: "image", label: "Photo", type: "image" },
      { prop: "description", label: "About", type: "textarea" },
      { prop: "address", label: "Address", type: "text" },
      { prop: "telephone", label: "Phone", type: "tel" },
      { prop: "openingHours", label: "Open", type: "text" },
      { prop: "priceRange", label: "Price", type: "text" },
      { prop: "url", label: "Website", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
