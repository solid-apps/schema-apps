<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Casino — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Casino",
  "name": "Casino Atrium Prague",
  "image": "https://picsum.photos/seed/casino-atrium/600/400",
  "description": "An elegant casino in the heart of Wenceslas Square housed within the historic Art Nouveau Palace Prague hotel. Features American roulette, blackjack, poker cash games and a bank of modern slot machines. The wood-panelled gaming floor, crystal chandeliers and attentive table-side cocktail service evoke old-world glamour.",
  "address": "Washingtonova 1600/17, 110 00 Prague 1, Czech Republic",
  "telephone": "+420 224 222 111",
  "openingHours": "Daily 14:00-06:00",
  "priceRange": "500–50 000 CZK buy-in",
  "url": "https://example.org/casino-atrium"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Casino",
    titleProp: "name",
    icon: "🎰",
    accent: "#b91c1c",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
