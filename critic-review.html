  "description": "A professional theatre review by Lidové noviny chief culture critic Pavel Tresnak of the 2025 Národní divadlo production of Shakespeare's The Tempest, directed by Michal Dočekal and starring Karel Roden as Prospero. The review praises Roden's magnetic stage presence and the production's inventive use of water effects on the revolving stage of the historic Národní divadlo auditorium. Published in the Friday culture supplement of Lidové noviny on 14 March 2025, the piece runs approximately 1,200 words and rates the production four out of five stars.",
  "reviewBody": "Karel Roden's Prospero is a masterclass in restrained power. Where lesser actors would rage, Roden whispers — and the Národní divadlo shakes. Dočekal's staging floods the revolving stage with three centimetres of actual water for the shipwreck prologue, a coup de théâtre that drew audible gasps on opening night. The island scenes are lit by hundreds of suspended candles (LED, but convincing), creating an amber haze that makes the historic auditorium feel like the inside of a reliquary. If the second half sags slightly under the weight of too many conceptual threads — colonialism, ecological collapse, Czech historical allegory — the final reconciliation scene between Roden and Vladimír Javorský's Caliban redeems everything. A haunting evening. ****",
