<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hospital — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Hospital",
  "name": "Všeobecná fakultní nemocnice v Praze",
  "image": "https://picsum.photos/seed/hospital-vfn-prague/600/400",
  "description": "The General University Hospital in Prague, founded in 1790 on the initiative of Emperor Joseph II, is one of the largest and oldest healthcare facilities in the Czech Republic. Located on the banks of the Vltava in Prague 2, it serves as the primary teaching hospital for the First Faculty of Medicine of Charles University. The campus encompasses over forty clinics and departments — from emergency medicine and cardiology to oncology and transplant surgery. The emergency department operates around the clock, and the helicopter pad on the roof serves the Central Bohemian air-ambulance network. Recent renovations added a state-of-the-art stroke centre and a robotic-assisted surgery suite.",
  "address": "U Nemocnice 499/2, 128 00 Prague 2 - Nové Město, Czech Republic",
  "telephone": "+420 224 961 111",
  "openingHours": "Emergency: 24/7; Outpatient clinics: Mo-Fr 07:00-18:00",
  "url": "https://www.vfn.cz"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Hospital",
    titleProp: "name",
    icon: "🏥",
    accent: "#dc2626",
    fields: [
      { prop: "name",        label: "Name",           type: "text" },
      { prop: "image",       label: "Image",          type: "image" },
      { prop: "description", label: "Description",    type: "textarea" },
      { prop: "address",     label: "Address",        type: "text" },
      { prop: "telephone",   label: "Phone",          type: "text" },
      { prop: "openingHours",label: "Opening Hours",  type: "text" },
      { prop: "url",         label: "Website",        type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
