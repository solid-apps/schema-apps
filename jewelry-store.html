<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JewelryStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "JewelryStore",
  "name": "Dana Bezáková",
  "image": "https://picsum.photos/seed/bezakova-jewelry/600/400",
  "description": "An atelier-style jewellery shop in Prague's Lesser Town, where each piece is designed and handcrafted on site by Dana Bezáková and her small team. Known for bold geometric forms in gold and silver, set with raw Moldavite — the green tektite found only in southern Bohemia. Bespoke engagement rings and one-of-a-kind statement necklaces are a speciality.",
  "address": "Nerudova 22, 118 00 Prague 1, Czech Republic",
  "telephone": "+420 257 531 428",
  "openingHours": "Mo-Sa 10:00-18:00",
  "priceRange": "2 000–80 000 CZK",
  "url": "https://example.org/bezakova-jewelry"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "JewelryStore",
    titleProp: "name",
    icon: "💍",
    accent: "#ca8a04",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
