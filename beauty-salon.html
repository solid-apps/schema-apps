<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeautySalon — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "BeautySalon",
  "name": "Lumina Beauty Lounge",
  "image": "https://picsum.photos/seed/lumina-beauty/600/400",
  "description": "A serene beauty lounge in Malá Strana offering facials, manicures, pedicures and lash lifts in a candlelit, jasmine-scented space. Treatments use Éminence organic skincare — cold-pressed and hand-mixed. The signature 90-minute hydration facial is a local favourite. Online booking only; small space ensures personalised attention.",
  "address": "Všehrdova 14, 118 00 Prague 1, Czech Republic",
  "telephone": "+420 257 530 882",
  "openingHours": "Mo-Fr 10:00-19:00, Sa 10:00-16:00",
  "priceRange": "500–3 500 CZK",
  "url": "https://example.org/lumina-beauty"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "BeautySalon",
    titleProp: "name",
    icon: "💅",
    accent: "#f43f5e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
