<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DepartmentStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "DepartmentStore",
  "name": "Kotva Department Store — Brutalist Icon on Náměstí Republiky",
  "image": "https://picsum.photos/seed/deptstore-kotva/600/400",
  "description": "Kotva (Anchor) is a landmark department store on the eastern edge of Náměstí Republiky in Prague 1, directly adjacent to the Palladium shopping centre. Designed by Czech architects Věra Machoninová and Vladimir Machonin and completed in 1975, Kotva is one of the finest examples of Brutalist commercial architecture in Central Europe — a six-storey hexagonal steel-and-glass structure whose rhythmic concrete ribs and deeply recessed windows create a striking geometric pattern visible from across the square. Originally built as a state-owned showcase of Czechoslovak consumer goods, Kotva offered everything from Parisian perfumes and Japanese electronics to domestic crystal and Bohemian garnet jewellery — a rare window onto global luxury behind the Iron Curtain. After years of post-1989 decline, the building was purchased by investors in 2020 and is undergoing a sensitive renovation by London-based Studio Olga Nová that preserves the Machonins' original hexagonal module while adding contemporary retail concepts, a rooftop restaurant with panoramic views of the Old Town and a basement food hall. Kotva remains a listed building and a beloved Prague landmark, its bold concrete silhouette contrasting with the Baroque and Art Nouveau neighbours that surround it.",
  "address": "Revoluční 655/1, Staré Město, Prague 1",
  "telephone": "+420 222 314 111",
  "openingHours": "Mo–Sa 10:00–20:00, Su 11:00–18:00",
  "priceRange": "Mid-range to premium",
  "url": "https://www.kotva.cz"
}
</script>
<main id="app"></main>
<script>
  window.APP = {
    type: "DepartmentStore",
    titleProp: "name",
    icon: "🏬",
    accent: "#475569",
    fields: [
      { prop: "name",         label: "Store",       type: "text" },
      { prop: "image",        label: "Image",       type: "image" },
      { prop: "description",  label: "Description", type: "textarea" },
      { prop: "address",      label: "Address",     type: "text" },
      { prop: "telephone",    label: "Phone",       type: "text" },
      { prop: "openingHours", label: "Hours",       type: "text" },
      { prop: "priceRange",   label: "Price",       type: "text" },
      { prop: "url",          label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
