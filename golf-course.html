<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GolfCourse — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "GolfCourse",
  "name": "Golf Club Praha — 18-Hole Championship Course at Motol",
  "image": "https://picsum.photos/seed/golf-motol/600/400",
  "description": "Golf Club Praha is the oldest golf club in the Czech Republic, founded in 1926 by a group of Czechoslovak diplomats and businessmen on a rolling site above the Motol valley in Prague 5. The 18-hole championship course (par 72, 6,315 metres from the blue tees) was designed by British architect C. H. Alison and later remodelled by Swiss course designer John I. Jacobs, retaining its classic parkland character with mature oaks, lindens and strategic bunkers framing every fairway. The front nine plays through relatively open terrain with views across the Motol basin, while the back nine dips into a wooded valley where the 14th hole — a 185-metre par 3 over water to a narrow island green — is considered one of the most photographed holes in Central Europe. The Art Deco clubhouse, built in 1928, survived both the Nazi occupation and Communism and today houses a restaurant, pro shop and a small museum chronicling nearly a century of Czech golf. The club hosts the annual Czech PGA Championship and has produced multiple Czech national champions.",
  "address": "Plzeňská 218, Motol, Prague 5",
  "telephone": "+420 257 216 211",
  "openingHours": "April–October: Tu–Su 07:00–20:00; November–March: Tu–Su 08:00–17:00",
  "priceRange": "CZK 1,800–2,800 per 18-hole round (visitors)",
  "url": "https://www.golfpraha.cz"
}
</script>
<main id="app"></main>
<script>
  window.APP = {
    type: "GolfCourse",
    titleProp: "name",
    icon: "⛳",
    accent: "#15803d",
    fields: [
      { prop: "name",         label: "Course",      type: "text" },
      { prop: "image",        label: "Image",       type: "image" },
      { prop: "description",  label: "Description", type: "textarea" },
      { prop: "address",      label: "Address",     type: "text" },
      { prop: "telephone",    label: "Phone",       type: "text" },
      { prop: "openingHours", label: "Hours",       type: "text" },
      { prop: "priceRange",   label: "Price",       type: "text" },
      { prop: "url",          label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
