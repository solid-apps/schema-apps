<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FurnitureStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "FurnitureStore",
  "name": "Drevodom",
  "image": "https://picsum.photos/seed/drevodom-furniture/600/400",
  "description": "A family-run Slovak-Czech workshop and showroom specialising in solid-oak furniture crafted using traditional joinery — dovetail drawers, mortise-and-tenon frames, hand-rubbed oil finishes. Every piece is made to order: dining tables, bookshelves, bed frames and bespoke kitchen islands. The showroom in Prague's Holešovice lets you run your hands over the grain before you commit.",
  "address": "Dukelských hrdinů 39, 170 00 Prague 7, Czech Republic",
  "telephone": "+420 222 666 111",
  "openingHours": "Mo-Fr 10:00-18:00, Sa 10:00-15:00",
  "priceRange": "8 000–120 000 CZK",
  "url": "https://example.org/drevodom"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "FurnitureStore",
    titleProp: "name",
    icon: "🛋️",
    accent: "#92400e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
