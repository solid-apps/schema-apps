<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HardwareStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "HardwareStore",
  "name": "Barna Praha",
  "image": "https://picsum.photos/seed/barna-hardware/600/400",
  "description": "A true old-school hardware store in Žižkov that has been serving the neighbourhood since the 1950s. Narrow aisles packed floor-to-ceiling with every screw, hinge, pipe fitting and tool imaginable. The staff know every drawer by heart — ask for an M6 countersunk bolt and they'll have it in their hand before you finish the sentence. No website, no app, just expertise.",
  "address": "Štítného 10, 130 00 Prague 3, Czech Republic",
  "telephone": "+420 222 781 445",
  "openingHours": "Mo-Fr 07:30-17:30, Sa 08:00-12:00",
  "priceRange": "5–3 000 CZK",
  "url": "https://example.org/barna-hardware"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "HardwareStore",
    titleProp: "name",
    icon: "🔨",
    accent: "#57534e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
