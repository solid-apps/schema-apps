<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Hotel",
  "name": "Hotel Paris Prague",
  "image": "https://picsum.photos/seed/hotel-paris-prague/800/450",
  "description": "A restored Art Nouveau gem in the heart of Old Town, steps from the Astronomical Clock. Elegant rooms with original mosaic floors, a rooftop terrace overlooking the spires of Prague, and a celebrated French-Czech restaurant.",
  "address": "U Obecního domu 1, Prague 1, Czech Republic",
  "telephone": "+420 222 195 195",
  "priceRange": "€€€",
  "starRating": "5",
  "url": "https://www.hotel-paris.cz",
  "checkinTime": "15:00",
  "checkoutTime": "11:00"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Hotel",
    titleProp: "name",
    icon: "🏨",
    accent: "#0369a1",
    fields: [
      { prop: "name",         label: "Hotel",        type: "text" },
      { prop: "image",        label: "Photo",        type: "image" },
      { prop: "description",  label: "Description",  type: "textarea" },
      { prop: "address",      label: "Address",      type: "text" },
      { prop: "telephone",    label: "Phone",        type: "text" },
      { prop: "priceRange",   label: "Price Range",  type: "text" },
      { prop: "starRating",   label: "Stars",        type: "text" },
      { prop: "url",          label: "Website",      type: "url" },
      { prop: "checkinTime",  label: "Check-in",     type: "text" },
      { prop: "checkoutTime", label: "Check-out",    type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
