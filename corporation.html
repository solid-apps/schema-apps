<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corporation — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Corporation",
  "name": "Škoda Auto a.s.",
  "image": "https://picsum.photos/seed/skoda-auto/600/400",
  "description": "One of the world's oldest continuously operating automobile manufacturers, founded in 1895 as Laurin & Klement in Mladá Boleslav. Now a wholly owned subsidiary of the Volkswagen Group, Škoda Auto produces over a million vehicles annually across models including the Octavia, Superb, Kodiaq and the all-electric Enyaq. The main plant in Mladá Boleslav houses design, engineering and a state-of-the-art battery assembly line. Known for delivering VW-group quality at a competitive price point across European and global markets.",
  "foundingDate": "1895",
  "address": "tř. Václava Klementa 869, 293 01 Mladá Boleslav, Czech Republic",
  "url": "https://example.org/skoda-auto"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Corporation",
    titleProp: "name",
    icon: "🏢",
    accent: "#1e40af",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "foundingDate",label: "Founded",      type: "text" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
