<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ToyStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "ToyStore",
  "name": "Hračkostroj",
  "image": "https://picsum.photos/seed/hrackostroj/600/400",
  "description": "A magical independent toy shop in Vinohrady packed floor-to-ceiling with wooden trains, hand-painted marionettes, building sets, science kits and plush animals. The owner sources traditional Czech and European toys — no plastic branding, no screens. Kids can try out the marble runs before buying. A neighbourhood gem since 1994.",
  "address": "Vinohradská 56, 120 00 Prague 2, Czech Republic",
  "telephone": "+420 222 521 330",
  "openingHours": "Mo-Fr 10:00-18:30, Sa 10:00-15:00",
  "priceRange": "50–3 000 CZK",
  "url": "https://example.org/hrackostroj"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "ToyStore",
    titleProp: "name",
    icon: "🧸",
    accent: "#f97316",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
