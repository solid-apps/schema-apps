<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LiteraryEvent — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "LiteraryEvent",
  "name": "An Evening with Haruki Murakami",
  "image": "https://picsum.photos/seed/author-reading/600/400",
  "description": "A special author reading and book signing event. Haruki Murakami reads from his latest novel, followed by an audience Q&A and signing session.",
  "startDate": "2026-11-05T19:00:00+01:00",
  "endDate": "2026-11-05T21:30:00+01:00",
  "location": "Municipal Library, Prague",
  "organizer": "Prague Writers' Festival",
  "url": "https://example.org/murakami-reading"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "LiteraryEvent",
    titleProp: "name",
    icon: "📖",
    accent: "#7c3aed",
    fields: [
      { prop: "name",        label: "Event name",  type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "startDate",   label: "Start date",  type: "text" },
      { prop: "endDate",     label: "End date",    type: "text" },
      { prop: "location",    label: "Location",    type: "text" },
      { prop: "organizer",   label: "Organizer",   type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
