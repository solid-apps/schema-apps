<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EducationEvent — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "EducationEvent",
  "name": "Introduction to Solid Pods",
  "image": "https://picsum.photos/seed/edu-workshop/600/400",
  "description": "A hands-on workshop covering the basics of Solid pods, personal data stores, and building decentralized web applications.",
  "startDate": "2026-07-15T09:00:00+02:00",
  "endDate": "2026-07-15T17:00:00+02:00",
  "location": "Prague, Czech Republic",
  "organizer": "Decentralized Web Community",
  "url": "https://example.org/solid-workshop"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "EducationEvent",
    titleProp: "name",
    icon: "🏫",
    accent: "#0284c7",
    fields: [
      { prop: "name",        label: "Event name",  type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "startDate",   label: "Start date",  type: "text" },
      { prop: "endDate",     label: "End date",    type: "text" },
      { prop: "location",    label: "Location",    type: "text" },
      { prop: "organizer",   label: "Organizer",   type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
