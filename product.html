<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Classic Leather Backpack",
  "image": "https://picsum.photos/seed/leather-backpack/600/400",
  "description": "Handcrafted full-grain leather backpack with brass hardware and padded laptop compartment.",
  "brand": "Heritage Goods",
  "sku": "HG-BP-2026",
  "color": "Brown",
  "material": "Full-grain leather",
  "url": "https://example.org/products/classic-backpack"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Product",
    titleProp: "name",
    icon: "🎒",
    accent: "#b45309",
    fields: [
      { prop: "name",        label: "Name",        type: "text" },
      { prop: "image",       label: "Photo",       type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "brand",       label: "Brand",        type: "text" },
      { prop: "sku",         label: "SKU",          type: "text" },
      { prop: "color",       label: "Color",        type: "text" },
      { prop: "material",    label: "Material",     type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
