<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bakery — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Bakery",
  "name": "Erhartová Pekárna",
  "image": "https://picsum.photos/seed/erhart-bakery/600/400",
  "description": "A family-run Czech bakery famous for its crusty rye sourdough, traditional trdelník baked over open coals and buttery croissants that sell out by noon. Everything is made fresh daily from locally milled flour. The morning queue of regulars is half the charm.",
  "address": "Kamenická 18, 170 00 Prague 7, Czech Republic",
  "telephone": "+420 234 567 890",
  "openingHours": "Mo-Sa 06:30-14:00, Su 07:00-13:00",
  "priceRange": "30–120 CZK",
  "url": "https://example.org/erhart-bakery"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Bakery",
    titleProp: "name",
    icon: "🥐",
    accent: "#d97706",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
