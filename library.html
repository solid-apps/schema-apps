<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Library",
  "name": "Klementinum National Library",
  "image": "https://picsum.photos/seed/klementinum/600/400",
  "description": "One of the most beautiful libraries in the world, housed in a 17th-century Jesuit complex in Prague's Old Town. The baroque Reading Hall features soaring ceiling frescoes, gilded bookcases lining every wall and a collection spanning six million volumes. The astronomical tower offers panoramic views over the city.",
  "address": "Mariánské náměstí 5, 110 00 Prague 1, Czech Republic",
  "openingHours": "Tu-Sa 09:00-17:00",
  "url": "https://example.org/klementinum"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Library",
    titleProp: "name",
    icon: "📚",
    accent: "#1d4ed8",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
