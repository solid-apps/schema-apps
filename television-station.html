<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TelevisionStation — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "TelevisionStation",
  "name": "Česká televize — ČT1",
  "image": "https://picsum.photos/seed/ceska-televize/600/400",
  "description": "The flagship channel of Czech Television, the public-service broadcaster founded on the eve of 1992. Broadcasting from the iconic Kavčí hory complex overlooking the Vltava in Prague 4, ČT1 delivers evening news at 19:00 and 22:00 that regularly draw over two million viewers. The channel commissions original drama series, documentary cycles and the beloved Sunday-night film slot, while also covering major sporting events and presidential elections. Funded through the television licence fee rather than advertising, it remains the most-watched channel in the Czech Republic.",
  "foundingDate": "1992",
  "address": "Kavčí hory, Na Hřebenech II 1133/4a, 140 00 Prague 4, Czech Republic",
  "url": "https://example.org/ceska-televize-ct1"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "TelevisionStation",
    titleProp: "name",
    icon: "📺",
    accent: "#6d28d9",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "foundingDate",label: "Founded",      type: "text" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
