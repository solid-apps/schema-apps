<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GovernmentOrganization — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "GovernmentOrganization",
  "name": "Magistrát hlavního města Prahy",
  "image": "https://picsum.photos/seed/magistrat-praha/600/400",
  "description": "The central administrative body of the City of Prague, housed in the neo-Renaissance New City Hall on Mariánské náměstí since 1945. Oversees municipal services across all 22 city districts — from urban planning, public transport subsidies and housing policy to waste management, cultural funding and the Prague Integrated Transport system. The elected City Council and the Mayor of Prague operate from this building.",
  "foundingDate": "1784",
  "address": "Mariánské náměstí 2, 110 00 Prague 1, Czech Republic",
  "url": "https://example.org/magistrat-praha"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "GovernmentOrganization",
    titleProp: "name",
    icon: "🏛️",
    accent: "#334155",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "foundingDate",label: "Founded",      type: "text" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
