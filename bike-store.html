<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BikeStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "BikeStore",
  "name": "Cyklosport Štěrba — Karlín",
  "image": "https://picsum.photos/seed/bikestore-sterba/600/400",
  "description": "Cyklosport Štěrba is a Prague cycling institution, founded in 1991 by former national road champion Milan Štěrba and now run by his daughter Tereza from a converted industrial loft in Karlín, the neighbourhood that has become Prague's cycling-commuter heartland. The shop occupies a double-height space on Křižíkova street with exposed brick walls and a mezzanine workshop overlooking the retail floor, where 120 bikes hang in suspended rows — from lightweight carbon race machines by Canyon and Specialized to bombproof steel touring bikes by Surly and Czech-made MTB frames by Kellys. Štěrba was among the first Czech shops to embrace the gravel movement and now carries a full gravel lineup from Trek, Canyon and Bombtrack, plus a curated selection of bikepacking bags from Apidura and Czech brand Roswheel. The service workshop on the mezzanine handles everything from seasonal drivetrain overhauls to full suspension rebuilds and custom wheel-building; the head mechanic, Honza, has built wheels for three Czech national track champions. The shop is also a hub for Prague's cycling community: Thursday night gravel rides leave from the front door at 18:30 from March through October, heading out along the Vltava riverbank to Prague 8's network of forest trails, and the shop hosts an annual Spring Bike Swap in April where hundreds of cyclists trade used frames, groupsets and accessories across the Karlín square outside. E-bike specialist since 2018 with Bosch and Shimano STEPS certified technicians.",
  "address": "Křižíkova 148/36, Karlín, Prague 8",
  "telephone": "+420 222 315 447",
  "openingHours": "Mo–Fr 10:00–19:00, Sa 09:00–15:00, Su closed",
  "priceRange": "CZK 3,900 (entry-level hybrid) – CZK 199,000 (Specialized S-Works Tarmac SL8)",
  "url": "https://www.cyklosport-sterba.cz/en"
}
</script>
<main id="app"></main>
<script>
  window.APP = {
    type: "BikeStore",
    titleProp: "name",
    icon: "🚲",
    accent: "#65a30d",
    fields: [
      { prop: "name",         label: "Store",       type: "text" },
      { prop: "image",        label: "Image",       type: "image" },
      { prop: "description",  label: "Description", type: "textarea" },
      { prop: "address",      label: "Address",     type: "text" },
      { prop: "telephone",    label: "Phone",       type: "text" },
      { prop: "openingHours", label: "Hours",       type: "text" },
      { prop: "priceRange",   label: "Price",       type: "text" },
      { prop: "url",          label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
