<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Florist — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Florist",
  "name": "Květinářství Bistra",
  "image": "https://picsum.photos/seed/bistra-flowers/600/400",
  "description": "A boutique florist in Dejvice known for lush, garden-style bouquets that look freshly gathered from a meadow. Seasonal blooms — ranunculus in spring, peonies in early summer, dahlias in autumn — are sourced from local Czech growers whenever possible. Also offers wedding floristry, dried-flower arrangements and a subscription service that delivers a wrapped bouquet to your door every Friday.",
  "address": "Tychonova 4, 160 00 Prague 6, Czech Republic",
  "telephone": "+420 233 920 117",
  "openingHours": "Mo-Fr 08:00-18:00, Sa 09:00-14:00",
  "priceRange": "150–3 000 CZK",
  "url": "https://example.org/bistra-flowers"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Florist",
    titleProp: "name",
    icon: "💐",
    accent: "#ec4899",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
