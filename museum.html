<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Museum — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Museum",
  "name": "National Museum of Computing",
  "image": "https://picsum.photos/seed/museum-comp/600/400",
  "description": "Housed in historic wartime buildings, the museum traces the evolution of computing from early cipher machines through mainframes to the modern age. Features working examples of Colossus, Bombe and the WITCH — the world's oldest original digital computer still running.",
  "address": "Bletchley Park, Milton Keynes, United Kingdom",
  "openingHours": "Tu-Su 10:30-17:00",
  "url": "https://example.org/national-museum-computing"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Museum",
    titleProp: "name",
    icon: "🏛️",
    accent: "#92400e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
