<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScreeningEvent — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "ScreeningEvent",
  "name": "Indie Film Night: Echoes of Tomorrow",
  "image": "https://picsum.photos/seed/film-screening/600/400",
  "description": "A one-night-only screening of the award-winning indie sci-fi drama followed by a Q&A with the director. Part of the Prague Independent Film Series.",
  "startDate": "2026-08-12T19:30:00+02:00",
  "endDate": "2026-08-12T22:00:00+02:00",
  "location": "Kino Aero, Prague",
  "organizer": "Prague Independent Film Series",
  "url": "https://example.org/indie-film-night"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "ScreeningEvent",
    titleProp: "name",
    icon: "🎬",
    accent: "#ef4444",
    fields: [
      { prop: "name",        label: "Event name",  type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "startDate",   label: "Start date",  type: "text" },
      { prop: "endDate",     label: "End date",    type: "text" },
      { prop: "location",    label: "Location",    type: "text" },
      { prop: "organizer",   label: "Organizer",   type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
