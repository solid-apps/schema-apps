<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NGO — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "NGO",
  "name": "Člověk v tísni",
  "image": "https://picsum.photos/seed/clovek-tisni/600/400",
  "description": "One of the largest Czech non-governmental organisations, founded in 1992 as a humanitarian response to the war in the Balkans. Today it runs long-term development programmes in over twenty countries, provides emergency relief after natural disasters, and operates social-integration projects across the Czech Republic — from debt counselling to educational support for disadvantaged children. Headquartered in Prague's Karlín district.",
  "foundingDate": "1992",
  "address": "Sokolovská 51, 186 00 Prague 8, Czech Republic",
  "url": "https://example.org/clovek-v-tisni"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "NGO",
    titleProp: "name",
    icon: "🤝",
    accent: "#0d9488",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "foundingDate",label: "Founded",      type: "text" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
