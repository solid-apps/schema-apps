<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Taxi — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Taxi",
  "name": "Liftago Prague — Licensed City Taxi",
  "image": "https://picsum.photos/seed/liftago-taxi/800/450",
  "description": "A licensed Prague taxi bookable through the Liftago app, which lets riders compare licensed drivers' prices and ratings rather than surge-pricing a single fleet. Cars are inspected, metered and city-licensed; fares are agreed before pickup and paid in-app. Typical centre-to-airport runs are fixed-price, and drivers accessible via the app speak basic English. Wheelchair-accessible vehicles can be requested.",
  "provider": "Liftago a.s.",
  "areaServed": "Prague and Central Bohemia",
  "url": "https://example.org/liftago"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Taxi",
    titleProp: "name",
    icon: "🚕",
    accent: "#eab308",
    fields: [
      { prop: "name", label: "Service", type: "text" },
      { prop: "image", label: "Photo", type: "image" },
      { prop: "description", label: "About", type: "textarea" },
      { prop: "provider", label: "Operator", type: "text" },
      { prop: "areaServed", label: "Coverage", type: "text" },
      { prop: "url", label: "App", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
