<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aquarium — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Aquarium",
  "name": "Oceanário de Lisboa",
  "image": "https://picsum.photos/seed/oceanario/600/400",
  "description": "Europe's largest indoor aquarium, built for the 1998 World Exposition. A central 5-million-litre tank houses sharks, rays and a sunfish, surrounded by four habitat zones replicating the North Atlantic, Pacific kelp forest, Indian coral reef and Antarctic coast. Over 8 000 marine animals across 500 species.",
  "address": "Esplanada Dom Carlos I, 1990-005 Lisboa, Portugal",
  "openingHours": "Daily 10:00-20:00",
  "url": "https://example.org/oceanario-lisboa"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Aquarium",
    titleProp: "name",
    icon: "🐠",
    accent: "#0891b2",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
