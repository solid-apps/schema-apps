<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recipe — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Classic Pancakes",
  "image": "https://picsum.photos/seed/pancakes-stack/600/400",
  "recipeIngredient": "1 cup all-purpose flour, 2 tbsp granulated sugar, 1 large egg, 1 cup whole milk, 2 tbsp unsalted butter (melted), 1 tsp baking powder, \u00bd tsp salt, 1 tsp vanilla extract",
  "recipeInstructions": "1. Whisk flour, sugar, baking powder, and salt in a large bowl.\n2. Beat egg, milk, melted butter, and vanilla in a separate bowl.\n3. Pour wet ingredients into dry and stir until just combined (lumps are fine).\n4. Heat a lightly greased griddle or skillet over medium-high heat.\n5. Pour \u00bc cup batter per pancake; cook until bubbles form on surface.\n6. Flip and cook until golden brown. Serve immediately.",
  "prepTime": "PT10M",
  "cookTime": "PT15M",
  "recipeYield": "4 servings (about 12 pancakes)",
  "description": "Fluffy American-style pancakes with crisp edges and a tender center \u2014 perfect for a lazy weekend breakfast."
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Recipe",
    titleProp: "name",
    icon: "🍳",
    accent: "#e8612c",
    fields: [
      { prop: "name",               label: "Name",         type: "text" },
      { prop: "image",              label: "Photo",        type: "image" },
      { prop: "recipeIngredient",   label: "Ingredients",  type: "text" },
      { prop: "recipeInstructions", label: "Instructions", type: "textarea" },
      { prop: "prepTime",           label: "Prep time",    type: "text" },
      { prop: "cookTime",           label: "Cook time",    type: "text" },
      { prop: "recipeYield",        label: "Yield",        type: "text" },
      { prop: "description",        label: "Description",  type: "textarea" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
