<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MusicAlbum — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "MusicAlbum",
  "name": "Random Access Memories",
  "image": "https://picsum.photos/seed/random-access-memories/800/400",
  "byArtist": "Daft Punk",
  "numTracks": "13",
  "genre": "Electronic, Funk, Disco, Synth-pop",
  "datePublished": "2013-05-17",
  "track": [
    { "@type": "MusicRecording", "name": "Give Life Back to Music", "duration": "PT4M34S" },
    { "@type": "MusicRecording", "name": "The Game of Love", "duration": "PT5M22S" },
    { "@type": "MusicRecording", "name": "Giorgio by Moroder", "duration": "PT9M04S" },
    { "@type": "MusicRecording", "name": "Within", "duration": "PT3M48S" },
    { "@type": "MusicRecording", "name": "Instant Crush", "duration": "PT5M37S" },
    { "@type": "MusicRecording", "name": "Lose Yourself to Dance", "duration": "PT5M43S" },
    { "@type": "MusicRecording", "name": "Touch", "duration": "PT8M18S" },
    { "@type": "MusicRecording", "name": "Get Lucky", "duration": "PT6M09S" },
    { "@type": "MusicRecording", "name": "Beyond", "duration": "PT4M43S" },
    { "@type": "MusicRecording", "name": "Motherboard", "duration": "PT5M41S" },
    { "@type": "MusicRecording", "name": "Fragments of Time", "duration": "PT4M39S" },
    { "@type": "MusicRecording", "name": "Doin' It Right", "duration": "PT4M11S" },
    { "@type": "MusicRecording", "name": "Contact", "duration": "PT6M21S" }
  ]
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "MusicAlbum",
    titleProp: "name",
    icon: "💿",
    accent: "#7c3aed",
    fields: [
      { prop: "name",          label: "Album",      type: "text" },
      { prop: "image",         label: "Cover",      type: "image" },
      { prop: "byArtist",      label: "Artist",     type: "text" },
      { prop: "numTracks",     label: "Tracks",     type: "text" },
      { prop: "genre",         label: "Genre",      type: "text" },
      { prop: "datePublished", label: "Released",   type: "text" },
      { prop: "track",         label: "Tracklist",  type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
