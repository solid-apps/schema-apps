<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MusicVenue — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "MusicVenue",
  "name": "Roxy — NoD Experimental Music Space",
  "image": "https://picsum.photos/seed/musicvenue-roxy-prague/600/400",
  "description": "One of Prague's most storied independent music venues, housed in a converted 1920s Art Deco cinema on Dlouhá Street in the Old Town. Roxy has been the beating heart of Prague's alternative and electronic music scene since the early 1990s, when it opened as a squatted cultural centre shortly after the Velvet Revolution. The main hall retains its original balcony and ornate ceiling moulding, now overlaid with decades of stickers, murals and graffiti. Capacity is approximately 800 standing. The adjacent NoD space upstairs hosts experimental sound-art installations, DJ workshops and intimate acoustic sessions. Past performers include The Prodigy, Björk, Beck, Aphex Twin and a who's who of Czech underground acts. The venue runs a celebrated analogue recording studio in the basement, open to visiting artists.",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Dlouhá 33",
    "addressLocality": "Praha 1 — Staré Město",
    "postalCode": "110 00",
    "addressCountry": "CZ"
  },
  "telephone": "+420 224 826 872",
  "url": "https://www.roxy.cz"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "MusicVenue",
    titleProp: "name",
    icon: "🎶",
    accent: "#e11d48",
    fields: [
      { prop: "name",       label: "Title",       type: "text" },
      { prop: "image",      label: "Image",       type: "image" },
      { prop: "description",label: "Description", type: "textarea" },
      { prop: "address",    label: "Address",     type: "text", display: "o.streetAddress + ', ' + o.addressLocality" },
      { prop: "telephone",  label: "Phone",       type: "text" },
      { prop: "url",        label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
