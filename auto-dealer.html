<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoDealer — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "AutoDealer",
  "name": "Auto Škoda Praha",
  "image": "https://picsum.photos/seed/skoda-dealer/600/400",
  "description": "An authorised Škoda dealership on the Chodov ring road with the full new-model range — Fabia, Kamiq, Octavia, Superb, Enyaq and Kodiaq — plus a certified pre-owned lot of over sixty vehicles. On-site service centre with original-Parts warranty work, tyre fitting and ADAS calibration. Test drives available same-day with a valid licence.",
  "address": "Ústřední 38, 141 00 Prague 4, Czech Republic",
  "telephone": "+420 261 002 100",
  "openingHours": "Mo-Fr 08:00-18:00, Sa 09:00-14:00",
  "priceRange": "300 000–1 500 000 CZK",
  "url": "https://example.org/skoda-praha"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "AutoDealer",
    titleProp: "name",
    icon: "🚙",
    accent: "#1e40af",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
