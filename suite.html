<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suite — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Suite",
  "name": "The Smetana Suite — Riverside Grand Suite",
  "image": "https://picsum.photos/seed/smetana-suite/800/450",
  "description": "An 85 m² corner suite overlooking the Vltava and the National Theatre, with a separate living room, dining nook for four, walk-in wardrobe and a marble bathroom with both soaking tub and walk-in shower. Original herringbone parquet and a restored ceiling fresco meet a discreet kitchenette, espresso bar and Dyson air purification. Butler unpacking service and late checkout to 14:00 included for direct bookings.",
  "occupancy": "2 adults + 2 children",
  "bed": "1 King + sofa bed",
  "amenityFeature": "River view, living room, soaking tub, kitchenette, butler service",
  "url": "https://example.org/smetana-suite"
}
</script>

<main id="app"></main>

<script>
  window.APP = {
    type: "Suite",
    titleProp: "name",
    icon: "🛎️",
    accent: "#b45309",
    fields: [
      { prop: "name", label: "Suite", type: "text" },
      { prop: "image", label: "Photo", type: "image" },
      { prop: "description", label: "Details", type: "textarea" },
      { prop: "occupancy", label: "Sleeps", type: "text" },
      { prop: "bed", label: "Beds", type: "text" },
      { prop: "amenityFeature", label: "Amenities", type: "text" },
      { prop: "url", label: "Book", type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
