<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CafeOrCoffeeShop — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "CafeOrCoffeeShop",
  "name": "Doubleshot Coffee Roasters",
  "image": "https://picsum.photos/seed/doubleshot-coffee/600/400",
  "description": "A specialty coffee roastery and café in Prague's Vinohrady district. Single-origin beans roasted in-house are brewed as pour-over, AeroPress or espresso by award-winning baristas. The minimalist industrial interior fills with the aroma of freshly cracked beans. Try the Ethiopian Yirgacheffe pour-over with a house-made cinnamon roll.",
  "address": "Milešovská 12, 130 00 Prague 3, Czech Republic",
  "telephone": "+420 222 333 444",
  "openingHours": "Mo-Fr 07:30-19:00, Sa-Su 09:00-19:00",
  "priceRange": "60–150 CZK",
  "url": "https://example.org/doubleshot"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "CafeOrCoffeeShop",
    titleProp: "name",
    icon: "☕",
    accent: "#92400e",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
