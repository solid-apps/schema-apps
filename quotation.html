<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quotation — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Quotation",
  "name": "The power of the Web is in its universality",
  "image": "https://picsum.photos/seed/quotation-tbl-universality/600/400",
  "description": "Perhaps the most widely cited remark by Sir Tim Berners-Lee, inventor of the World Wide Web. Spoken in the context of ensuring the web remains accessible to all people regardless of disability, language, hardware or network. The quotation appears on the W3C website and has been referenced in countless talks, papers and policy documents on digital accessibility and the open web.",
  "text": "The power of the Web is in its universality. Access by everyone regardless of disability is an essential aspect.",
  "author": {
    "@type": "Person",
    "name": "Tim Berners-Lee"
  },
  "dateCreated": "1997-01-01"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Quotation",
    titleProp: "name",
    icon: "📜",
    accent: "#7c2d12",
    fields: [
      { prop: "name",        label: "Title",          type: "text" },
      { prop: "image",       label: "Image",          type: "image" },
      { prop: "description", label: "Description",    type: "textarea" },
      { prop: "text",        label: "Quotation",      type: "textarea" },
      { prop: "author",      label: "Author",         type: "text", display: "o.name" },
      { prop: "dateCreated", label: "Date",           type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
