<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EducationalOccupationalCredential — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "EducationalOccupationalCredential",
  "name": "AWS Certified Solutions Architect — Associate (SAA-C03)",
  "image": "https://picsum.photos/seed/credential-aws-sa/600/400",
  "description": "The AWS Certified Solutions Architect – Associate certification validates the holder's ability to design distributed systems and applications on Amazon Web Services. It covers selecting appropriate AWS services for compute, storage, networking and database workloads; designing resilient, high-performing and cost-optimised architectures; and applying the Well-Architected Framework. The exam consists of 65 multiple-choice and multi-response questions over 130 minutes. Recognised globally as a foundational cloud-architecture credential, it is often a minimum requirement for mid-level and senior DevOps and platform-engineering roles in the Czech tech market.",
  "credentialCategory": "Professional Certification",
  "recognizedBy": {
    "@type": "Organization",
    "name": "Amazon Web Services"
  },
  "validIn": {
    "@type": "Country",
    "name": "Global (recognised in Czech Republic and EU)"
  },
  "educationalLevel": "Intermediate — requires 1–2 years of hands-on AWS experience"
}
</script>
<main id="app"></main>
<script>
  window.APP = {
    type: "EducationalOccupationalCredential",
    titleProp: "name",
    icon: "🎖️",
    accent: "#7c2d12",
    fields: [
      { prop: "name",             label: "Credential",   type: "text" },
      { prop: "image",            label: "Image",        type: "image" },
      { prop: "description",      label: "Description",  type: "textarea" },
      { prop: "credentialCategory",label: "Category",    type: "text" },
      { prop: "recognizedBy",     label: "Issued By",    type: "text", display: "o.name" },
      { prop: "validIn",          label: "Valid In",     type: "text", display: "o.name" },
      { prop: "educationalLevel", label: "Level",        type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
