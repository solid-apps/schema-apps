<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoObject — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "name": "The Future of Personal Data — Solid Pod Explained",
  "image": "https://picsum.photos/seed/solid-video-future/800/450",
  "description": "A deep dive into Solid pods, decentralized data ownership, and how personal AI assistants like Charlie can leverage user-controlled data to deliver transformative experiences — all without compromising privacy.",
  "uploadDate": "2026-03-15",
  "duration": "PT12M34S",
  "contentUrl": "https://example.com/videos/solid-pod-explained"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "VideoObject",
    titleProp: "name",
    icon: "🎬",
    accent: "#ef4444",
    fields: [
      { prop: "name",        label: "Title",       type: "text" },
      { prop: "image",       label: "Thumbnail",   type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "uploadDate",  label: "Published",   type: "text" },
      { prop: "duration",    label: "Duration",    type: "text" },
      { prop: "contentUrl",  label: "Video URL",   type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
