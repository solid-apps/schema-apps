<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClothingStore — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "ClothingStore",
  "name": "La Forme",
  "image": "https://picsum.photos/seed/la-forme-boutique/600/400",
  "description": "A curated Czech fashion boutique in Prague's Karlín district, showcasing independent European designers. Expect clean silhouettes, natural fabrics and a muted colour palette — linen coats from Latvia, hand-dyed silk from Tuscany and minimalist leather accessories made just outside Prague. Personal styling sessions available by appointment.",
  "address": "Křižíkova 72, 186 00 Prague 8, Czech Republic",
  "telephone": "+420 222 444 999",
  "openingHours": "Mo 13:00-18:00, Tu-Sa 10:00-19:00",
  "priceRange": "1 500–12 000 CZK",
  "url": "https://example.org/la-forme"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "ClothingStore",
    titleProp: "name",
    icon: "👗",
    accent: "#db2777",
    fields: [
      { prop: "name",        label: "Name",         type: "text" },
      { prop: "image",       label: "Image",        type: "image" },
      { prop: "description", label: "Description",  type: "textarea" },
      { prop: "address",     label: "Address",      type: "text" },
      { prop: "telephone",   label: "Telephone",    type: "tel" },
      { prop: "openingHours",label: "Opening hours", type: "text" },
      { prop: "priceRange",  label: "Price range",  type: "text" },
      { prop: "url",         label: "Website",      type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
