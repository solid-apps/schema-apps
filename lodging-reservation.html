<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LodgingReservation — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "LodgingReservation",
  "name": "Hotel Paris Prague — Deluxe Double Room, 3 Nights",
  "image": "https://picsum.photos/seed/lodging-paris-prague/600/400",
  "description": "Confirmed reservation for a Deluxe Double Room at Hotel Paris Prague, a four-star Art Nouveau property in the heart of Old Town on U Obecního dvora street. Room overlooks the inner courtyard and comes with king-size bed, marble bathroom with rain shower, Nespresso machine and complimentary minibar. Rate includes buffet breakfast in the Café de Paris and access to the rooftop wellness area with views of the Powder Tower. Free cancellation up to forty-eight hours before check-in.",
  "reservationId": "HPP-2026-78412",
  "underName": "Melvin Carvalho",
  "reservationFor": "Hotel Paris Prague",
  "checkinTime": "2026-07-12T15:00:00+02:00",
  "checkoutTime": "2026-07-15T11:00:00+02:00"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "LodgingReservation",
    titleProp: "name",
    icon: "🛏️",
    accent: "#0369a1",
    fields: [
      { prop: "name",          label: "Reservation",      type: "text" },
      { prop: "image",         label: "Image",            type: "image" },
      { prop: "description",   label: "Description",      type: "textarea" },
      { prop: "reservationId", label: "Booking Ref",      type: "text" },
      { prop: "underName",     label: "Guest",            type: "text" },
      { prop: "reservationFor",label: "Hotel",            type: "text" },
      { prop: "checkinTime",   label: "Check-in",         type: "text" },
      { prop: "checkoutTime",  label: "Check-out",        type: "text" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
