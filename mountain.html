<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mountain — schema.org app</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<!-- JSON-LD data island -->
<script type="application/ld+json" id="data">
{
  "@context": "https://schema.org",
  "@type": "Mountain",
  "name": "Sněžka",
  "image": "https://picsum.photos/seed/snezka-mountain/600/400",
  "description": "The highest peak in the Czech Republic at 1 603 metres, straddling the border with Poland in the Krkonoše (Giant Mountains). On a clear day the summit offers panoramic views across Bohemia and Silesia. A modern weather station and observatory crowns the top, reachable by a red hiking trail from Pec pod Sněžkou or a cable car.",
  "address": "Krkonoše National Park, Czech Republic",
  "url": "https://example.org/snezka"
}
</script>

<main id="app"></main>

<!-- per-type config: this is the ONLY thing that changes between apps -->
<script>
  window.APP = {
    type: "Mountain",
    titleProp: "name",
    icon: "⛰️",
    accent: "#57534e",
    fields: [
      { prop: "name",        label: "Name",        type: "text" },
      { prop: "image",       label: "Image",       type: "image" },
      { prop: "description", label: "Description", type: "textarea" },
      { prop: "address",     label: "Address",     type: "text" },
      { prop: "url",         label: "Website",     type: "url" },
    ],
  };
</script>
<script src="./app.js"></script>
</body>
</html>
